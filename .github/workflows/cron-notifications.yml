name: Scheduled Notifications

# Runs twice a day to trigger proactive push notifications for tutors.
# Requires GitHub Actions secrets:
#   CRON_SECRET — same value as CRON_SECRET in Supabase Edge Function secrets
#
# How to set up:
#   1. Generate a random secret: openssl rand -hex 32
#   2. Add to GitHub: Settings → Secrets → Actions → New secret → CRON_SECRET
#   3. Add to Lovable: Project Settings → Supabase → Edge Function Secrets → CRON_SECRET

on:
  schedule:
    # Morning: 07:00 UTC = 09:00 Kyiv (UTC+2) / 08:00 Stockholm (UTC+1)
    - cron: "0 7 * * *"
    # Evening: 16:00 UTC = 18:00 Kyiv / 17:00 Stockholm
    - cron: "0 16 * * *"
  # Allow manual trigger for testing
  workflow_dispatch:
    inputs:
      window:
        description: "Notification window"
        required: true
        default: "morning"
        type: choice
        options: [morning, evening]

jobs:
  notify:
    name: Trigger notifications
    runs-on: ubuntu-latest
    steps:
      # 17.11: GitHub запускає розклад із запізненням на 6–8 годин. Раніше вікно визначалось
      # за годинником запуску («07 → ранок, інакше вечір»), тому ранкові сповіщення не
      # надсилались ВЗАГАЛІ (запуск о 14:00 вважався вечірнім), а вечірні приходили вночі
      # (16.11 — о 01:53 за Києвом). Тепер: вікно — з розкладу, який спрацював, а запізнілий
      # запуск нічого не надсилає. Вчасно сповіщення ставить сама база (pg_cron,
      # міграція 20261117120000); цей воркфлоу лишається для ручного запуску й як запасний.
      - name: Detect window
        id: window
        env:
          SCHEDULE: ${{ github.event.schedule }}
          EVENT: ${{ github.event_name }}
          MANUAL: ${{ inputs.window }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "window=$MANUAL" >> "$GITHUB_OUTPUT"; echo "late=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          HOUR=$((10#$(date -u +%H)))
          if [ "$SCHEDULE" = "0 7 * * *" ]; then W=morning; FROM=7; else W=evening; FROM=16; fi
          echo "window=$W" >> "$GITHUB_OUTPUT"
          if [ "$HOUR" -ge "$FROM" ] && [ "$HOUR" -le $((FROM + 1)) ]; then
            echo "late=no" >> "$GITHUB_OUTPUT"
          else
            echo "late=yes" >> "$GITHUB_OUTPUT"
            echo "::notice::Запуск «$W» спізнився (зараз ${HOUR}:xx UTC, мав бути о ${FROM}:00) — нічого не надсилаємо, щоб сповіщення не прийшло вночі."
          fi

      - name: Check CRON_SECRET is configured
        if: steps.window.outputs.late != 'yes'
        run: |
          if [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "::error::CRON_SECRET is not set in GitHub Secrets."
            echo "::error::Go to: Settings → Secrets and variables → Actions → New repository secret"
            echo "::error::Name: CRON_SECRET  Value: (same as in Supabase Edge Function secrets)"
            exit 1
          fi
          echo "CRON_SECRET is configured (length: ${#CRON_SECRET})"
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: Call scheduled-notifications Edge Function
        if: steps.window.outputs.late != 'yes'
        run: |
          RESPONSE=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            --max-time 30 \
            -X POST \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -d "{\"window\":\"${{ steps.window.outputs.window }}\"}" \
            "https://kficbcjqcbhqhjimxfed.supabase.co/functions/v1/scheduled-notifications")

          echo "HTTP status: $RESPONSE"
          echo "Response body:"
          cat /tmp/response.json

          if [ "$RESPONSE" = "403" ]; then
            echo "::error::403 Forbidden — CRON_SECRET mismatch between GitHub and Supabase Edge Function secrets"
            exit 1
          fi
          if [ "$RESPONSE" != "200" ]; then
            echo "::error::Edge Function returned HTTP $RESPONSE"
            exit 1
          fi
