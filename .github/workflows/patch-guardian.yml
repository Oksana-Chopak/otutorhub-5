name: "🛡️ Patch Guardian"

on:
  push:
    branches: [main]

jobs:
  patch-guardian:
    if: >-
      (contains(github.event.head_commit.message, 'X-Lovable') ||
      contains(github.event.head_commit.author.name, 'lovable') ||
      github.event.head_commit.author.email == 'lovable-dev[bot]@users.noreply.github.com') &&
      !contains(github.event.head_commit.message, '[skip guardian]')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Run Patch Guardian
        id: guardian
        run: python3 .github/scripts/patch_guardian.py

      - name: Commit restored patches
        if: steps.guardian.outputs.patched == 'true'
        run: |
          git config user.name "Patch Guardian"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(guardian): restore patches after Lovable deploy [skip guardian]"
          git push
