# «Сторож» (22.09): один ланцюг воріт на КОЖЕН пуш, хто б не пушив (Lovable,
# агент, власниця), + робот на живому проді + один рядок у Telegram власниці.
#
# Що було до цього: цей файл з 25.08 мав дубльований ключ `env` → GitHub не міг
# його прочитати → 835 запусків поспіль «failure» без жодної перевірки, і ніхто
# не помітив. А коли він і працював, то перевіряв `npx tsc --noEmit` (тобто нічого)
# і не знав про половину воріт. Тепер список воріт живе В ОДНОМУ місці —
# scripts/gates.mjs — і CI виконує рівно його. Валідність цього YAML стереже
# сам gates.mjs (ворота `workflows`) і vitest (guardian.test.ts).
name: CI

on:
  push:
    branches: [main, "claude/**", "lovable/**", "feature/**", "fix/**"]
  pull_request:
    branches: [main]
  schedule:
    # 05:30 UTC = 08:30 Київ / 07:30 Стокгольм — ранкова перевірка ЖИВОГО проду
    - cron: "30 5 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: write

jobs:
  # ─── 1. Ворота: рівно scripts/gates.mjs, з базою для db-replay ──────────────
  gates:
    name: 🚧 Ворота (scripts/gates.mjs)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: "1"
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: placeholder_anon_key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Ворота
        id: gates
        run: |
          set -o pipefail
          node scripts/gates.mjs 2>&1 | tee gates.log
      - name: Хвіст журналу → коментар до коміту (агент читає його зі сторінки коміту)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "🚧 Ворота ЧЕРВОНІ @ ${GITHUB_SHA::7}"; echo '```'; grep -E "^(❌|✅|⛔|🟡|🟢)" gates.log | head -40; echo '```'; echo '```'; tail -c 3000 gates.log; echo '```'; } > body.md
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -F body=@body.md || true
      - name: Зберегти журнал
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gates-log
          path: gates.log
          retention-days: 7

  # ─── 2. Робот на ЖИВОМУ проді: 4 персони, свіжість трьох каналів ─────────────
  prod-smoke:
    name: 🤖 Прод (tests/prod)
    needs: [gates]
    if: >-
      always() &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.gates.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "1"
      PROD_BASE_URL: https://otutorhub.com
      PROD_SUPABASE_URL: https://kficbcjqcbhqhjimxfed.supabase.co
      # Після пушу прод ще НЕ опублікований — розбіжність лише попередження.
      # Уранці — вимога: минула доба, main мусить бути на проді.
      PROD_FRESH: ${{ github.event_name == 'schedule' && 'require' || 'warn' }}
      TEST_TUTOR_EMAIL: ${{ secrets.TEST_TUTOR_EMAIL }}
      TEST_TUTOR_PASSWORD: ${{ secrets.TEST_TUTOR_PASSWORD }}
      TEST_MANAGER_EMAIL: ${{ secrets.TEST_MANAGER_EMAIL }}
      TEST_MANAGER_PASSWORD: ${{ secrets.TEST_MANAGER_PASSWORD }}
      TEST_STUDENT_EMAIL: ${{ secrets.TEST_STUDENT_EMAIL }}
      TEST_STUDENT_PASSWORD: ${{ secrets.TEST_STUDENT_PASSWORD }}
      TEST_HUB_TUTOR_EMAIL: ${{ secrets.TEST_HUB_TUTOR_EMAIL }}
      TEST_HUB_TUTOR_PASSWORD: ${{ secrets.TEST_HUB_TUTOR_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Що має бути на проді (штамп джерел і коміт main)
        id: expect
        run: |
          echo "stamp=$(node scripts/source-stamp.mjs)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"
      - name: Робот на проді
        env:
          EXPECT_STAMP: ${{ steps.expect.outputs.stamp }}
          EXPECT_SHA: ${{ steps.expect.outputs.sha }}
        run: npx playwright test -c playwright.prod.config.ts
      - name: Зберегти звіт робота
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-report
          path: |
            prod-report.json
            prod-report/
            test-results/
          retention-days: 7

  # ─── 3. Один рядок власниці в Telegram (через edge `ci-report`, CRON_SECRET) ──
  report:
    name: 📣 Вердикт у Telegram
    needs: [gates, prod-smoke]
    if: always() && (github.event_name != 'push' || github.ref == 'refs/heads/main') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: gates-log
          path: .
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with:
          name: prod-report
          path: .
        continue-on-error: true
      - name: Скласти повідомлення
        env:
          GATES_RESULT: ${{ needs.gates.result }}
          GATES_TAIL_FILE: gates.log
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          TITLE: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/ci-notify.mjs
      - name: Надіслати в Telegram
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET не заданий — повідомлення лише в журналі"; exit 0; fi
          node -e '
            const fs = require("fs");
            const text = fs.readFileSync("ci-message.txt", "utf8");
            fetch("https://kficbcjqcbhqhjimxfed.supabase.co/functions/v1/ci-report", {
              method: "POST",
              headers: { "Content-Type": "application/json", "x-cron-secret": process.env.CRON_SECRET },
              body: JSON.stringify({ text }),
            }).then(async (r) => { console.log("ci-report →", r.status, await r.text()); })
              .catch((e) => console.log("ci-report недосяжний:", e.message));
          '
