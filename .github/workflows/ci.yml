name: CI

on:
  push:
    branches: [main, "claude/**", "lovable/**", "feature/**"]
  pull_request:
    branches: [main]

jobs:
  # ─── Job 1: TypeScript + Lint + Build ────────────────────────────────────
  build:
    name: 🔨 Build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          # Lovable-реєстр недосяжний з GitHub-раннерів → публічний npmjs
          sed -i 's|https://europe-west1-npm.pkg.dev/lovable-core-prod/sandbox-npm-cache/|https://registry.npmjs.org/|g' package-lock.json
          npm ci

      - name: TypeScript — zero errors
        run: npx tsc --noEmit
        # If this fails → Lovable broke types

      - name: ESLint — zero errors
        run: npx eslint src --ext .tsx,.ts --quiet
        # --quiet: only report errors (not warnings), fail only on errors
        # Warnings from Lovable-generated code (no-explicit-any etc) are tracked
        # separately and cleaned up each sprint via check-hardcode.mjs
        continue-on-error: false

      - name: Vite build
        run: npm run build
        env:
          # Provide fake env vars so build doesn't fail on missing .env
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder_anon_key
        # If this fails → app won't run in production

  # ─── Job 2: Unit tests ───────────────────────────────────────────────────
  unit-tests:
    name: 🧪 Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          # Lovable-реєстр недосяжний з GitHub-раннерів → публічний npmjs
          sed -i 's|https://europe-west1-npm.pkg.dev/lovable-core-prod/sandbox-npm-cache/|https://registry.npmjs.org/|g' package-lock.json
          npm ci

      - name: Run Vitest
        run: npm run test -- --reporter=verbose
        # Shows which tests pass/fail clearly

  # ─── Job 3: i18n audit ───────────────────────────────────────────────────
  i18n-audit:
    name: 🌍 i18n audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          # Lovable-реєстр недосяжний з GitHub-раннерів → публічний npmjs
          sed -i 's|https://europe-west1-npm.pkg.dev/lovable-core-prod/sandbox-npm-cache/|https://registry.npmjs.org/|g' package-lock.json
          npm ci

      - name: Check for missing translation keys
        run: node scripts/check-i18n.mjs

      - name: Check for hardcoded Ukrainian strings
        run: node scripts/check-hardcode.mjs

  # ─── Job 4: UX audit ─────────────────────────────────────────────────────
  ux-audit:
    name: 🎨 UX audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check touch target sizes (no h-9 on inputs)
        run: node scripts/check-ux.mjs
        # Catches regressions like h-9 inputs, text-[11px] content

  # ─── Job 5: E2E tests ─────────────────────────────────────────────────────
  e2e-tests:
    name: 🎭 E2E tests
    runs-on: ubuntu-latest
    # Credentials configured via GitHub Secrets (TEST_TUTOR_EMAIL etc)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          # Lovable-реєстр недосяжний з GitHub-раннерів → публічний npmjs
          sed -i 's|https://europe-west1-npm.pkg.dev/lovable-core-prod/sandbox-npm-cache/|https://registry.npmjs.org/|g' package-lock.json
          npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: npx playwright test --reporter=line
        env:
          E2E_BASE_URL: https://otutorhub.com
          TEST_TUTOR_EMAIL: ${{ secrets.TEST_TUTOR_EMAIL }}
          TEST_TUTOR_PASSWORD: ${{ secrets.TEST_TUTOR_PASSWORD }}
          TEST_MANAGER_EMAIL: ${{ secrets.TEST_MANAGER_EMAIL }}
          TEST_MANAGER_PASSWORD: ${{ secrets.TEST_MANAGER_PASSWORD }}
          TEST_STUDENT_EMAIL: ${{ secrets.TEST_STUDENT_EMAIL }}
          TEST_STUDENT_PASSWORD: ${{ secrets.TEST_STUDENT_PASSWORD }}

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ─── Робот-смоукер: клацає застосунок замість власниці ───────────────────
  owner-smoke:
    name: 🤖 Owner smoke (роль менеджера)
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [build, unit-tests]
    env:
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      SMOKE_BASE_URL: ${{ secrets.SMOKE_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - name: Skip until secrets exist
        id: gate
        run: |
          if [ -z "$E2E_EMAIL" ]; then echo "run=false" >> "$GITHUB_OUTPUT";           else echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          sed -i 's|https://europe-west1-npm.pkg.dev/lovable-core-prod/sandbox-npm-cache/|https://registry.npmjs.org/|g' package-lock.json
          npm ci
          npx playwright install --with-deps chromium
      - name: Smoke — логін, борги+самозвірка, форма уроку, консоль чиста
        if: steps.gate.outputs.run == 'true'
        run: |
          set -o pipefail
          npx playwright test tests/e2e/smoke-roles.spec.ts --reporter=line 2>&1 | tee smoke.log
      # Самозвіт: хвіст помилки — коментарем до коміту (Клод читає через API;
      # сирі логи ранера його пісочниці закриті).
      - name: Self-report failure as commit comment
        if: failure() && steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=$(printf '🤖 Owner smoke FAILED @ %s\n```\n%s\n```' "$GITHUB_SHA" "$(tail -c 3500 smoke.log 2>/dev/null || echo no-log)" | jq -Rs .)
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
            -d "{\"body\": $BODY }" >/dev/null || true
      - name: Upload playwright report
        if: failure() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: owner-smoke-report
          path: playwright-report/
          retention-days: 5
